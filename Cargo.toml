[package]
name = "crema"
version = "0.4.0"
edition = "2024"
description = "An AI-agent-first Ruby type checker"
license = "MIT"
# All integration tests build into the single `integration` target below:
# one binary pays one link instead of one per tests/*.rs file. The files
# stay at their tests/ paths (declared as modules in tests/main.rs) so
# branches editing them merge cleanly.
autotests = false

[dependencies]
ruby-prism = "1.9.0"
ruby-rbs-sys = { path = "vendor/ruby-rbs-sys" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
rustc-hash = "2.1.2"
globset = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# bincode upstream ceased development (see reddit /r/rust 1pnz1iz).
# Pin to the last 1.x release rather than chasing 2.x/3.x — a successor
# (postcard / rkyv / etc.) is a separate design discussion, not a bump.
bincode = "=1.3.3"
memmap2 = "0.9"
mimalloc = "0.1"
# Work-stealing pool for the per-file phases: parse + inline collect
# (ADR-0033) and type check (ADR-0034).
rayon = "1.12"

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "integration"
path = "tests/main.rs"

# Line tables keep file:line in panic backtraces while shrinking the debug
# artifacts and from-scratch builds. Debugger variables are gone; for an
# lldb session, rebuild with full debuginfo via
# `CARGO_PROFILE_DEV_DEBUG=true cargo build`.
[profile.dev]
debug = "line-tables-only"

# One codegen unit: rustc otherwise splits the crate into 16 units and runs a
# crate-local ThinLTO pass to optimize across them, duplicating work. Measured
# on the crema crate: build user CPU -49% (wall +70%; parallel dev sessions
# compete for CPU, so total CPU is what matters), and the binary runs 4-5%
# fewer instructions on the steep workload because the whole crate is one
# optimization unit. Debug keeps the default: 16 units doubled the
# incremental rebuild after a one-file edit.
[profile.release]
codegen-units = 1

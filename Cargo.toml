[package]
name = "crema"
version = "0.3.2"
edition = "2024"
description = "An AI-agent-first Ruby type checker"
license = "MIT"

[dependencies]
ruby-prism = "1.9.0"
ruby-rbs-sys = { path = "vendor/ruby-rbs-sys" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
rustc-hash = "2.1.2"
globset = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# bincode upstream ceased development (see reddit /r/rust 1pnz1iz).
# Pin to the last 1.x release rather than chasing 2.x/3.x — a successor
# (postcard / rkyv / etc.) is a separate design discussion, not a bump.
bincode = "=1.3.3"
memmap2 = "0.9"
mimalloc = "0.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
# Crema uses Arc<T> to mirror RBS Ruby-side reference semantics, even when T is
# not Send/Sync. The type checker is single-threaded today; revisit if/when
# parallelism is introduced.
arc_with_non_send_sync = "allow"
